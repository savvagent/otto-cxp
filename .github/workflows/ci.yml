name: CI

# The server: crates/ (cxp-core, cxp-mcp, cxp-api, cxp-server). The TypeScript
# SDK, React package, and web app: sdk/typescript, packages/react, apps/web.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # `#[sqlx::test]` runs against a real Postgres, no mocks. A superuser, as
      # in compose.yaml, so the baseline migration can create and grant otto_app.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cxp
          POSTGRES_PASSWORD: cxp
          POSTGRES_DB: otto_cxp
        ports:
          - 15435:5432
        options: >-
          --health-cmd "pg_isready -U cxp -d otto_cxp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cxp:cxp@localhost:15435/otto_cxp
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The baseline creates otto_app itself and tolerates losing the race, but
      # many test databases migrate in parallel against one cluster-scoped role;
      # creating it first takes the race out.
      - name: Pre-create the otto_app role
        run: psql "$DATABASE_URL" -c "CREATE ROLE otto_app NOLOGIN;"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  # Migrations are append-only. sqlx stores each applied migration's checksum
  # and refuses to start when a known file no longer matches, so editing even
  # a comment in an applied migration takes down the next deploy. sqlx ignores
  # applied versions it does not know (`MIGRATOR` sets `ignore_missing` for
  # rollbacks), so this job is what catches a deleted or renamed migration.
  migrations-append-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to existing migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-status --diff-filter=MDR "origin/${BASE_REF}...HEAD" -- 'crates/*/migrations/*')
          if [ -n "$changed" ]; then
            echo "::error::existing migrations were modified, deleted, or renamed; add a new migration instead"
            echo "$changed"
            exit 1
          fi

  # Proves the deploy artifact builds; `cargo test` can pass while the image
  # does not.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The TypeScript SDK, React package, and web app (pnpm workspace).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The root package.json has no `packageManager` field, so the version is
      # pinned here (the lockfile is v9). If `packageManager` is added later,
      # delete `version:`: pnpm/action-setup refuses to take both.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # Every green push to main deploys, once the repo variable FLY_DEPLOY is
  # `enabled`. Rob sets it only after the first deploy (a hand `fly deploy`) has
  # been verified; until then this job is skipped and a merge deploys nothing. flyctl builds remotely on Fly's builder, the same path as a
  # hand-run `fly deploy`. FLY_API_TOKEN is a deploy token scoped to this one
  # app (`fly tokens create deploy -a otto-cxp`).
  deploy:
    runs-on: ubuntu-latest
    needs: [rust, docker-build, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.FLY_DEPLOY == 'enabled'
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -a otto-cxp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
