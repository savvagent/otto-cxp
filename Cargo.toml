[workspace]
resolver = "2"
members = [
  "crates/cxp-core",
  "crates/cxp-http",
  "crates/cxp-mcp",
  "crates/cxp-api",
  "crates/cxp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
cxp-core = { path = "crates/cxp-core" }
cxp-http = { path = "crates/cxp-http" }
cxp-mcp = { path = "crates/cxp-mcp" }
cxp-api = { path = "crates/cxp-api" }

# otto-cxp is a resource server of the otto platform: identity, auth, orgs,
# teams, plans, and billing live there. This workspace links only the
# tenant-isolation substrate (`otto-tenant`: pinned transactions, RLS proof)
# and the resource-server client (`otto-resource`: introspection, usage
# shipping, member and team lookups, webhook verification). One rev for both,
# bumped deliberately and together rather than tracking a branch.
otto-tenant = { git = "https://github.com/savvagent/otto-platform", rev = "fa1ae08c8d5760c1df9752281a078192032e7d24" }
otto-resource = { git = "https://github.com/savvagent/otto-platform", rev = "fa1ae08c8d5760c1df9752281a078192032e7d24" }

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate", "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }
http = "1"
rmcp = { version = "=2.0.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.1", features = ["chrono04", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
futures = "0.3"
url = "2"
# Loads .env for local runs. Never overrides a variable already set, so a
# deployment's real environment always wins over a file that got shipped.
dotenvy = "0.15"
# An HTTP client for the console's calls to the platform's token endpoint
# and cxp-server's lifecycle test. Already in the tree through otto-resource
# (with rustls-tls); no default features here.
reqwest = { version = "0.12", default-features = false }
# The console's sign-in: the cookie's SHA-256 (what is stored), its random
# bytes, base64url for cookies and PKCE, and constant-time comparison of the
# OAuth state. All already in the tree through otto-tenant and otto-resource.
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
subtle = "2"

[profile.release]
lto = "thin"
strip = true
