# Local Postgres for development and `#[sqlx::test]` integration tests.
# Host port 15435 is deliberately non-standard so it cannot clash with a system
# Postgres or with otto-factory's (15433) and otto-flags' (15434) containers.
# Bound to loopback only: the credentials are the well-known dev ones, so the
# port must not be reachable from the network.
# Plain postgres:16: the schema needs only the stock pgcrypto and pg_trgm.
services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: otto-cxp-postgres
    environment:
      POSTGRES_USER: cxp
      POSTGRES_PASSWORD: cxp
      POSTGRES_DB: otto_cxp
    ports:
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxp -d otto_cxp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - cxp-pg:/var/lib/postgresql/data

volumes:
  cxp-pg:
